<!-- Replace the existing inline browser-detection <script> in index.html with this block. -->
<script>
(function () {
  const hasCefSharpBridge = typeof window.CefSharp !== 'undefined' &&
    typeof window.CefSharp.PostMessage === 'function';
  document.documentElement.classList.add(
    hasCefSharpBridge ? 'browser-supported' : 'browser-unsupported'
  );
})();
</script>
